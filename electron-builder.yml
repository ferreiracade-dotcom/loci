appId: org.loci.app
productName: Loci
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - "**/*.node"
# Commentaries, dogmatics and Church Fathers volumes Loci ships and copies into the vault on
# first launch (bundledCommentaries.ts, dogmatics.ts, fathersIndex.ts).
extraResources:
  - from: resources/commentaries
    to: commentaries
  - from: resources/dogmatics
    to: dogmatics
  - from: resources/fathers
    to: fathers
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
electronDownload:
  cache: .electron-cache
